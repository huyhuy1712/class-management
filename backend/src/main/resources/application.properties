spring.application.name=backend

# Development email uses Spring Mail SMTP. Production overrides the provider in application-prod.properties.
app.mail.provider=${MAIL_PROVIDER:smtp}
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:true}
spring.mail.properties.mail.smtp.connectiontimeout=${MAIL_SMTP_CONNECTION_TIMEOUT:10000}
spring.mail.properties.mail.smtp.timeout=${MAIL_SMTP_TIMEOUT:10000}
spring.mail.properties.mail.smtp.writetimeout=${MAIL_SMTP_WRITE_TIMEOUT:10000}
app.mail.api-key=${MAILJET_API_KEY:}
app.mail.api-secret=${MAILJET_API_SECRET:}
app.mail.api-url=${MAILJET_API_URL:https://api.mailjet.com/v3.1/send}
app.mail.from=${MAIL_FROM:}
app.mail.outbox.poll-delay-ms=${MAIL_OUTBOX_POLL_DELAY_MS:3000}

# Server port
server.port=${PORT:8080}
server.forward-headers-strategy=framework

# DATABASE
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.data-source-properties.reWriteBatchedInserts=true

# JPA / HIBERNATE
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.batch_size=50

# FLYWAY
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Initial Admin
app.admin.username=${ADMIN_USERNAME}
app.admin.password=${ADMIN_PASSWORD}
app.admin.email=${ADMIN_EMAIL}
app.support.phone=${ADMIN_PHONE:}
app.admin.full-name=${ADMIN_FULL_NAME:System Administrator}

# JWT
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration=${JWT_EXPIRATION:86400000}

# Authentication cookie. Local HTTP uses Secure=false and SameSite=Lax.
# Production must set COOKIE_SECURE=true and COOKIE_SAME_SITE=None because
# the frontend and backend are hosted on different sites.
app.auth.cookie-secure=${COOKIE_SECURE:false}
app.auth.cookie-same-site=${COOKIE_SAME_SITE:Lax}
app.auth.google.enabled=${GOOGLE_OAUTH_ENABLED:false}
app.frontend.url=${FRONTEND_URL:http://localhost:5173}

# MoMo stays disabled until merchant credentials and the public IPN URL are configured.
app.payment.momo.enabled=${MOMO_ENABLED:false}
app.payment.momo.endpoint=${MOMO_ENDPOINT:https://test-payment.momo.vn/v2/gateway/api/create}
app.payment.momo.partner-code=${MOMO_PARTNER_CODE:}
app.payment.momo.access-key=${MOMO_ACCESS_KEY:}
app.payment.momo.secret-key=${MOMO_SECRET_KEY:}
app.payment.momo.ipn-url=${MOMO_IPN_URL:}

spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:disabled}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:disabled}
spring.security.oauth2.client.registration.google.scope=openid,profile,email

spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# =========================
#  File Storage
# =========================
# =========================
# File Storage
# =========================

app.storage.type=${STORAGE_TYPE:local}

# Local
app.storage.local-dir=${STORAGE_LOCAL_DIR:uploads}
app.storage.local-base-url=${STORAGE_LOCAL_BASE_URL:http://localhost:8080}

# Supabase
app.storage.supabase.url=${SUPABASE_URL:}
app.storage.supabase.secret-key=${SUPABASE_SECRET_KEY:}
app.storage.supabase.bucket=${SUPABASE_BUCKET:class-management}

# Upload limit
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=40MB

spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${JPA_FORMAT_SQL:false}

# Exam media: stable paths, temporary registry and persistent cleanup retries.
app.exam-media.max-image-bytes=${EXAM_MEDIA_MAX_IMAGE_BYTES:5242880}
app.exam-media.max-audio-bytes=${EXAM_MEDIA_MAX_AUDIO_BYTES:8388608}
app.exam-media.max-image-pixels=${EXAM_MEDIA_MAX_IMAGE_PIXELS:16000000}
app.exam-media.temp-ttl-hours=${EXAM_MEDIA_TEMP_TTL_HOURS:24}
app.exam-media.cleanup-delay-ms=${EXAM_MEDIA_CLEANUP_DELAY_MS:60000}

# Complete-exam JSON is bounded independently of multipart upload limits.
app.exam.max-request-bytes=${EXAM_MAX_REQUEST_BYTES:2097152}

# Private PDF import workspace must be outside app.storage.local-dir.
# Keep this directory on a persistent private volume, shared if running multiple BE instances.
app.exam-import.private-dir=${EXAM_IMPORT_PRIVATE_DIR:.private/exam-imports}
app.exam-import.backend-dir=${EXAM_IMPORT_BACKEND_DIR:.}
app.exam-import.enabled=${EXAM_IMPORT_ENABLED:true}

# ==========================================
# CẤU HÌNH SPRING AI VỚI GROK (xAI)
# ==========================================
# Đọc API Key từ biến môi trường
spring.ai.openai.api-key=${GROK_API_KEY:not-configured}

# Trỏ Base URL sang endpoint của xAI
spring.ai.openai.base-url=https://api.groq.com/openai/v1
spring.ai.openai.chat.completions-path=/chat/completions

spring.ai.openai.chat.options.model=openai/gpt-oss-120b
spring.ai.openai.chat.options.temperature=0.2

# Giới hạn số lượt chat miễn phí tại Landing Page
app.ai.guest-max-messages=3